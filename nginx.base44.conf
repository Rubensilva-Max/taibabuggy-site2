# Dev-only nginx config used by docker-compose.base44.yml (mounted over
# /etc/nginx/conf.d/default.conf). The repository is served straight from disk.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Development server: never let the browser hold on to a stale page or asset,
  # so an edited file always shows up on reload.
  add_header Cache-Control "no-store" always;

  # Keep repository internals (.git, ignored dotfiles) out of the served site.
  location ~ /\. {
    deny all;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
