# Base44 sandbox environment for TaibaBuggyAdventure.
#
# This is a build-free static site (index.html + style.css + script.js + assets/),
# so there is nothing to compile: nginx serves the checkout itself, bind-mounted
# read-only. Editing a file is visible on the next page load (no rebuild needed).
services:
  web:
    image: nginx:alpine
    labels:
      base44.project: "TaibaBuggyAdventure"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      # Mounted file by file on purpose: the checkout directory itself is not
      # world-traversable in the sandbox, so mounting ./ as the doc root would
      # give nginx's unprivileged worker a 403. New top-level pages/assets need
      # an entry here too — see AGENTS.md.
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    healthcheck:
      # Probe real content, not just an open port.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q TaibaBuggyAdventure"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
